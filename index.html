<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's live</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1b1b22;--mute:#7b7a85;--line:#e1ded6;--live:#e5262d}
@media (prefers-color-scheme:dark){:root{--bg:#14141b;--card:#1d1d27;--ink:#f1f0f5;--mute:#8c8b98;--line:#2c2c3a;--live:#ff4a50}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 18px 60px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
#summary{color:var(--mute);margin:0 0 28px}
.list{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
.card img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.card.off{opacity:.62}
.card.on{border:2px solid var(--live);padding:13px 15px}
.info{min-width:0;flex:1}
.name{font-weight:700}
.sub{color:var(--mute);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:99px;background:var(--live);color:#fff;display:flex;align-items:center;gap:7px}
.badge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:p 1.4s infinite}
.off .badge{background:none;color:var(--mute);border:1px solid var(--line)}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.badge i{animation:none}}
a:focus-visible{outline:3px solid var(--live);outline-offset:2px}
#empty{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Who's live</h1>
  <p id="summary">Checking…</p>
  <div class="list" id="list"></div>
</main>
<script>
const list = document.getElementById("list"), summary = document.getElementById("summary");
async function load(){
  try{
    const res = await fetch("live.json?t=" + Date.now());
    const data = await res.json();
    const people = data.creators.slice().sort((a,b)=> (b.live-a.live) || a.name.localeCompare(b.name));
    list.textContent = "";
    if(!people.length){ summary.textContent = "No creators yet. Add handles to creators.json."; return; }
    const n = people.filter(p=>p.live).length;
    summary.textContent = n ? n + " live right now" : "Nobody is live right now";
    for(const p of people){
      const a = document.createElement("a");
      a.className = "card " + (p.live ? "on" : "off");
      a.href = p.live ? "https://www.youtube.com/watch?v=" + p.videoId : "https://www.youtube.com/" + p.handle;
      a.target = "_blank"; a.rel = "noopener";
      const img = document.createElement("img"); img.src = p.avatar; img.alt = "";
      const info = document.createElement("div"); info.className = "info";
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = p.name;
      const sub = document.createElement("div"); sub.className = "sub";
      sub.textContent = p.live ? (p.title || "Streaming now") : "Offline";
      info.append(nm, sub);
      const b = document.createElement("div"); b.className = "badge";
      if(p.live){ b.append(document.createElement("i"), "Watch live"); } else { b.textContent = "Offline"; }
      a.append(img, info, b);
      list.append(a);
    }
  }catch(e){ summary.textContent = "Couldn't load the live list. Try again in a minute."; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
